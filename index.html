<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Ev Planı</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ev Planı">
<meta name="theme-color" content="#f6f4f0">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
  html,body{margin:0;background:#f6f4f0}
  #durum{font:18px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#555;text-align:center;padding:90px 24px}
  #durum button{margin-top:18px;font:inherit;font-weight:700;padding:14px 22px;border-radius:14px;border:none;background:#191714;color:#fff}
</style>
</head>
<body>
<div id="durum">Yükleniyor…</div>
<script>
(function(){
  var API="https://script.google.com/macros/s/AKfycbywdIsoV4g096VtI6a61ffaanK0dTkppj7zf9_eu9eW3pTZISjxWVFn-INJ1rbzjIkL/exec";
  var durum=document.getElementById("durum");
  var qk=new URLSearchParams(location.search).get("k")||"";
  var k=qk;
  try{ if(k) localStorage.setItem("evplani_k",k); else k=localStorage.getItem("evplani_k")||""; }catch(e){}

  if(!k){
    durum.innerHTML="🔒<br>Kişisel link bulunamadı.<br><br>Size gönderilen linki Safari'de açın,<br>sonra Paylaş → Ana Ekrana Ekle deyin.";
    return;
  }
  if(!qk){ try{ history.replaceState(null,"",location.pathname+"?k="+encodeURIComponent(k)); }catch(e){} }

  // Ana ekrana eklenince de kişisel link korunsun (Android için)
  try{
    var man={name:"Ev Planı",short_name:"Ev Planı",display:"standalone",background_color:"#f6f4f0",theme_color:"#f6f4f0",
      start_url:location.origin+location.pathname+"?k="+encodeURIComponent(k),scope:location.origin+location.pathname,
      icons:[{src:location.origin+location.pathname+"icon-192.png",sizes:"192x192",type:"image/png"},
             {src:location.origin+location.pathname+"icon-512.png",sizes:"512x512",type:"image/png"}]};
    var l=document.createElement("link"); l.rel="manifest";
    l.href="data:application/manifest+json,"+encodeURIComponent(JSON.stringify(man));
    document.head.appendChild(l);
  }catch(e){}

  // Uygulamanın sunucu çağrıları (google.script.run yerine)
  var SHIM='<script>(function(){var API='+JSON.stringify(API)+';'+
    'window.google={script:{get run(){var s=null,f=null,px;var o={withSuccessHandler:function(h){s=h;return px},withFailureHandler:function(h){f=h;return px}};'+
    'px=new Proxy(o,{get:function(t,p){if(p in t)return t[p];return function(){var a=[].slice.call(arguments);'+
    'fetch(API+"?fn="+encodeURIComponent(p)+"&a="+encodeURIComponent(JSON.stringify(a))).then(function(r){return r.json()})'+
    '.then(function(j){if(j&&j.hata!==undefined&&j.sonuc===undefined){f&&f(new Error(j.hata))}else{s&&s(j?j.sonuc:null)}})'+
    '.catch(function(e){f&&f(e)})}}});return px}}}})();<\/script>';
  var EK='<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">'+
    '<meta name="apple-mobile-web-app-title" content="Ev Planı"><title>Ev Planı</title>'+
    '<link rel="apple-touch-icon" href="apple-touch-icon.png">';

  var SAKLA="evplani_html_"+k;
  function goster(html,taze){
    var h=html.replace(/<title>[\s\S]*?<\/title>/i,"")
              .replace("<head>","<head>"+EK+SHIM+(taze?"<script>window.__TAZE=1<\/script>":""));
    document.open(); document.write(h); document.close();
  }
  function getir(){
    var ev=""; try{ ev=localStorage.getItem("ev")||""; }catch(e){}
    return fetch(API+"?mod=json&k="+encodeURIComponent(k)+(ev?"&ev="+encodeURIComponent(ev):"")).then(function(r){ return r.json(); });
  }
  function yukle(){
    var eski=null; try{ eski=localStorage.getItem(SAKLA); }catch(e){}
    if(eski){
      // Saklanan ekranla anında aç; uygulama güncel veriyi kendisi arkadan alır.
      // Sayfa ayrıştırması bitmeden document.open çalışmaz, o yüzden hazır olmasını bekle.
      if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",function(){ goster(eski,false); });
      else goster(eski,false);
      getir().then(function(j){ if(j&&j.ok&&j.html){ try{ localStorage.setItem(SAKLA,j.html); }catch(e){} }
                                  else if(j&&j.ok===false){ try{ localStorage.removeItem(SAKLA); localStorage.removeItem("evplani_k"); }catch(e){} location.reload(); } })
             .catch(function(){});
      return;
    }
    durum.textContent="Yükleniyor…";
    getir().then(function(j){
        if(!j || !j.ok || !j.html){
          durum.innerHTML="🔒<br>Bu bağlantı geçerli değil.<br>Size gönderilen kişisel linki kullanın.";
          try{ localStorage.removeItem("evplani_k"); }catch(e){}
          return;
        }
        try{ localStorage.setItem(SAKLA,j.html); }catch(e){}
        goster(j.html,true);
      })
      .catch(function(){
        durum.innerHTML="İnternet bağlantısı yok gibi görünüyor.<br><button id='tekrar'>Tekrar dene</button>";
        document.getElementById("tekrar").onclick=yukle;
      });
  }
  yukle();
})();
</script>
</body>
</html>
